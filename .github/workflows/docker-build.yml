name: Docker images

on:
  push:
    branches:
      - master
      - new_arch
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms to build
        required: false
        default: linux/amd64

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/davidnoronha1/camera_driver

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPU: NVIDIA DeepStream base (nvh264enc/nvjpegenc/NvCUDAPublisher).
          - name: gpu
            dockerfile: docker/Dockerfile
            tag: dev
            latest: true
          # CPU-only: plain Ubuntu base, no CUDA/DeepStream.
          - name: cpu
            dockerfile: docker/Dockerfile.nogpu
            tag: nogpu
            latest: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          tags="${{ env.IMAGE_BASE }}:${{ matrix.tag }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tags="$tags\n${{ env.IMAGE_BASE }}:${{ github.ref_name }}"
            if [ "${{ matrix.latest }}" = "true" ]; then
              tags="$tags\n${{ env.IMAGE_BASE }}:latest"
            fi
          fi
          printf 'tags=%b\n' "$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
