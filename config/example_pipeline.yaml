---
# Alternative: play back a recording made by MkvRecorderElement, undistorting
# it automatically using the calibration embedded in the file — no manual
# passing of calibration required. MkvPlaybackElement reads the file's
# camera-metadata and publishes it to the pipeline's scratchpad;
# UndistortElement picks it up from there on its own. If the file has no
# calibration (or nvdewarper isn't installed), UndistortElement is a
# no-op passthrough instead of an error.
#
# Note: MkvPlaybackElement must come before UndistortElement in the elements
# list — the scratchpad publish happens while the pipeline is being resolved,
# in element order.
#
# pipeline:
#   type: Pipeline
#
# elements:
#   - type: MkvPlaybackElement
#     location: /tmp/camera_driver_out.mkv
#
#   - type: UndistortElement
#
#   - type: DisplayPublisher
